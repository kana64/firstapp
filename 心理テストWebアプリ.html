<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#3A4F41">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>コミュニケーションスタイル診断</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
:root {
  --bg: #E8E6E1;
  --surface: #FFFFFF;
  --ink: #2C2926;
  --muted: #7A7269;
  --accent: #3A4F41;
  --accent-light: #E6EBE7;
  --accent-warm: #C17C53;
  --line: rgba(44,41,38,0.08);
  --shadow: 0 4px 24px -6px rgba(0,0,0,0.12);
  --radius: 24px;
  --space: clamp(1.25rem, 1rem + 1vw, 2rem);
  --step-0: clamp(0.95rem, 0.9rem + 0.25vw, 1.05rem);
  --step-1: clamp(1.1rem, 1rem + 0.5vw, 1.35rem);
  --step-2: clamp(1.6rem, 1.3rem + 1.2vw, 2.2rem);
  --step-3: clamp(2.2rem, 1.7rem + 2vw, 3.2rem);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body {
  height: 100%;
  overflow: hidden;
}

body {
  font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
  background: var(--bg);
  color: var(--ink);
  font-size: var(--step-0);
  line-height: 1.75;
}

#app {
  height: 100%;
  max-width: 480px;
  margin: 0 auto;
  background: var(--surface);
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
}

.screen {
  display: none;
  flex-direction: column;
  height: 100%;
  overflow-y: auto;
  overflow-x: hidden;
  animation: fadeIn 0.35s ease both;
}
.screen.active { display: flex; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* Intro */
.intro-visual {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: var(--space);
  text-align: center;
  background: linear-gradient(180deg, var(--accent-light) 0%, var(--surface) 100%);
}

.app-icon {
  width: 100px;
  height: 100px;
  border-radius: 28px;
  background: linear-gradient(135deg, var(--accent), #5A7A6A);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 1.5rem;
  box-shadow: 0 12px 32px -8px rgba(58,79,65,0.35);
}

.app-icon svg {
  width: 48px;
  height: 48px;
  stroke: #fff;
  stroke-width: 2;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.intro-title {
  font-family: "Noto Serif JP", "Hiragino Mincho ProN", "Yu Mincho", serif;
  font-size: var(--step-3);
  font-weight: 700;
  color: var(--ink);
  margin-bottom: 0.5rem;
  line-height: 1.3;
}

.intro-subtitle {
  color: var(--muted);
  font-size: var(--step-0);
  margin-bottom: 2rem;
  max-width: 32ch;
}

.start-btn {
  width: 100%;
  max-width: 280px;
  background: var(--accent);
  color: #fff;
  border: none;
  padding: 1.1rem;
  border-radius: 999px;
  font-size: 1rem;
  font-weight: 500;
  cursor: pointer;
  font-family: inherit;
  box-shadow: 0 4px 16px -4px rgba(58,79,65,0.4);
  transition: transform 0.15s, box-shadow 0.15s;
}
.start-btn:active { transform: scale(0.97); }

.intro-footer {
  font-size: 0.75rem;
  color: var(--muted);
  margin-top: 1rem;
}

/* Question */
.question-header {
  padding: 1.5rem var(--space) 0.5rem;
}

.progress-track {
  height: 6px;
  background: var(--line);
  border-radius: 3px;
  margin-bottom: 1.25rem;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent-warm));
  border-radius: 3px;
  width: 0%;
  transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

.question-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 0.8rem;
  color: var(--muted);
}

.question-number {
  font-family: "Noto Serif JP", serif;
  font-size: 1rem;
  font-weight: 700;
  color: var(--accent);
}

.question-body {
  flex: 1;
  padding: 0 var(--space);
  display: flex;
  flex-direction: column;
}

.question-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 1.5rem;
  margin-bottom: 1.5rem;
  box-shadow: 0 2px 12px -4px rgba(0,0,0,0.06);
}

.question-text {
  font-family: "Noto Serif JP", "Hiragino Mincho ProN", "Yu Mincho", serif;
  font-size: var(--step-1);
  line-height: 1.7;
  color: var(--ink);
}

.options {
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
  padding-bottom: var(--space);
}

.option-btn {
  text-align: left;
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: 16px;
  padding: 1rem 1.25rem;
  font-size: 0.95rem;
  color: var(--ink);
  cursor: pointer;
  font-family: inherit;
  line-height: 1.55;
  transition: all 0.15s ease;
  position: relative;
  overflow: hidden;
}

.option-btn:active {
  transform: scale(0.98);
  background: var(--accent-light);
  border-color: var(--accent);
}

/* Loading */
.loading-screen {
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: var(--space);
  background: linear-gradient(180deg, var(--accent-light) 0%, var(--surface) 60%);
}

.loading-ring {
  width: 64px;
  height: 64px;
  border: 3px solid var(--line);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.9s linear infinite;
  margin-bottom: 1.5rem;
}

@keyframes spin { to { transform: rotate(360deg); } }

.loading-title {
  font-family: "Noto Serif JP", serif;
  font-size: var(--step-2);
  margin-bottom: 0.5rem;
}

.loading-sub {
  color: var(--muted);
  font-size: 0.9rem;
}

/* Result */
.result-screen {
  overflow-y: auto;
  background: linear-gradient(180deg, var(--accent-light) 0%, var(--surface) 30%);
}

.result-header {
  text-align: center;
  padding: 2rem var(--space) 1rem;
}

.result-eyebrow {
  font-size: 0.8rem;
  letter-spacing: 0.1em;
  color: var(--accent-warm);
  margin-bottom: 0.5rem;
}

.result-type {
  font-family: "Noto Serif JP", "Hiragino Mincho ProN", "Yu Mincho", serif;
  font-size: var(--step-3);
  font-weight: 700;
  color: var(--ink);
  margin-bottom: 0.25rem;
}

.result-tagline {
  font-size: var(--step-0);
  color: var(--muted);
  margin-bottom: 1.25rem;
}

/* Capture area */
#result-capture {
  background: linear-gradient(180deg, #F7F9F7 0%, #fff 40%);
  border: 1px solid var(--line);
  border-radius: 24px;
  padding: 1.75rem;
  margin: 0 var(--space) 1.25rem;
  box-shadow: 0 4px 20px -6px rgba(0,0,0,0.08);
}

.capture-header {
  text-align: center;
  margin-bottom: 1.25rem;
}

.capture-badge {
  width: 90px;
  height: 90px;
  border-radius: 50%;
  margin: 0 auto 0.75rem;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: "Noto Serif JP", serif;
  font-size: 1.8rem;
  font-weight: 700;
  color: #fff;
  background: linear-gradient(135deg, var(--accent), var(--accent-warm));
  box-shadow: 0 6px 20px -6px rgba(58,79,65,0.35);
}

.capture-title {
  font-family: "Noto Serif JP", serif;
  font-size: 1.5rem;
  font-weight: 700;
  color: var(--ink);
  margin-bottom: 0.2rem;
}

.capture-tagline {
  font-size: 0.9rem;
  color: var(--muted);
}

.capture-desc {
  font-size: 0.95rem;
  line-height: 1.85;
  color: var(--ink);
  margin-bottom: 1.25rem;
}

.capture-traits {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.5rem;
  margin-bottom: 1.25rem;
}

.ctrait-card {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 0.75rem;
  text-align: center;
}

.ctrait-label {
  font-size: 0.7rem;
  color: var(--muted);
  letter-spacing: 0.03em;
  margin-bottom: 0.15rem;
}

.ctrait-value {
  font-weight: 700;
  font-size: 0.9rem;
  color: var(--ink);
  font-family: "Noto Serif JP", serif;
}

.capture-comp {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 1rem;
}

.capture-comp-title {
  font-family: "Noto Serif JP", serif;
  font-size: 0.95rem;
  font-weight: 700;
  text-align: center;
  margin-bottom: 0.6rem;
}

.capture-comp-row {
  display: flex;
  justify-content: space-around;
  text-align: center;
}

.ccomp-label {
  font-size: 0.7rem;
  color: var(--muted);
  margin-bottom: 0.1rem;
}

.ccomp-type {
  font-weight: 700;
  font-size: 0.9rem;
  color: var(--accent);
  font-family: "Noto Serif JP", serif;
}

.capture-footer {
  text-align: center;
  margin-top: 1rem;
  font-size: 0.75rem;
  color: var(--muted);
  letter-spacing: 0.05em;
}

/* Action buttons */
.result-actions {
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
  padding: 0 var(--space) var(--space);
}

.action-btn {
  width: 100%;
  padding: 1rem;
  border-radius: 999px;
  font-size: 1rem;
  font-weight: 500;
  cursor: pointer;
  font-family: inherit;
  border: none;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.4rem;
}

.action-btn:active { transform: scale(0.98); }

.btn-primary {
  background: var(--accent);
  color: #fff;
  box-shadow: 0 4px 16px -4px rgba(58,79,65,0.35);
}

.btn-secondary {
  background: transparent;
  border: 1.5px solid var(--accent);
  color: var(--accent);
}

.btn-tertiary {
  background: transparent;
  border: 1.5px solid var(--line);
  color: var(--muted);
  font-size: 0.9rem;
}

.toast {
  position: fixed;
  bottom: 1.5rem;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--ink);
  color: #fff;
  padding: 0.75rem 1.5rem;
  border-radius: 999px;
  font-size: 0.9rem;
  opacity: 0;
  pointer-events: none;
  transition: all 0.3s ease;
  z-index: 100;
  white-space: nowrap;
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* Scrollbar hide */
.screen::-webkit-scrollbar { display: none; }
.screen { -ms-overflow-style: none; scrollbar-width: none; }

/* Reduced motion */
@media (prefers-reduced-motion: reduce) {
  .screen, .progress-fill, .option-btn, .loading-ring, .toast {
    animation: none;
    transition: none;
  }
}
</style>
</head>
<body>

<div id="app">

  <!-- Intro -->
  <div class="screen active" id="intro-screen">
    <div class="intro-visual">
      <div class="app-icon">
        <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
      </div>
      <div class="intro-title">コミュニケーション<br>スタイル診断</div>
      <div class="intro-subtitle">6つの質問で、あなたの対人スタイルと相性の良いタイプを見つけます</div>
      <button class="start-btn" onclick="startTest()">診断を始める</button>
      <div class="intro-footer">所要時間：約1分</div>
    </div>
  </div>

  <!-- Question -->
  <div class="screen" id="question-screen">
    <div class="question-header">
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      <div class="question-meta">
        <div class="question-number" id="q-number">Q1</div>
        <div id="q-counter">1 / 6</div>
      </div>
    </div>
    <div class="question-body">
      <div class="question-card">
        <div class="question-text" id="q-text"></div>
      </div>
      <div class="options" id="options"></div>
    </div>
  </div>

  <!-- Loading -->
  <div class="screen loading-screen" id="loading-screen">
    <div class="loading-ring"></div>
    <div class="loading-title">分析中...</div>
    <div class="loading-sub">あなたの選択パターンを読み解いています</div>
  </div>

  <!-- Result -->
  <div class="screen result-screen" id="result-screen">
    <div class="result-header">
      <div class="result-eyebrow">診断結果</div>
      <div class="result-type" id="r-type"></div>
      <div class="result-tagline" id="r-tagline"></div>
    </div>

    <!-- Capture target -->
    <div id="result-capture">
      <div class="capture-header">
        <div class="capture-badge" id="c-badge"></div>
        <div class="capture-title" id="c-type"></div>
        <div class="capture-tagline" id="c-tagline"></div>
      </div>
      <div class="capture-desc" id="c-desc"></div>
      <div class="capture-traits" id="c-traits"></div>
      <div class="capture-comp">
        <div class="capture-comp-title">相性の良いタイプ</div>
        <div class="capture-comp-row" id="c-comp"></div>
      </div>
      <div class="capture-footer">コミュニケーションスタイル診断</div>
    </div>

    <div class="result-actions">
      <button class="action-btn btn-primary" onclick="downloadResult()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        結果を画像で保存
      </button>
      <button class="action-btn btn-secondary" onclick="shareResult()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
        結果をシェアする
      </button>
      <button class="action-btn btn-tertiary" onclick="copyText()">テキストをコピー</button>
      <button class="action-btn btn-tertiary" onclick="restartTest()" style="margin-top:0.25rem;">もう一度診断する</button>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
const questions = [
  {
    text: "初対面の人と話すとき、あなたはどんな感じですか？",
    options: [
      { text: "自分から積極的に話しかけ、場を盛り上げる", type: "A" },
      { text: "相手の話をよく聞き、質問を返す", type: "B" },
      { text: "ユーモアや軽いジョークで距離を縮める", type: "C" },
      { text: "落ち着いて話し、深いテーマを選ぶ", type: "D" }
    ]
  },
  {
    text: "友人が悩みを相談してきたら、あなたはどうしますか？",
    options: [
      { text: "解決策を一緒に考え、行動プランを提案する", type: "A" },
      { text: "その気持ちに寄り添い、話を最後まで聞く", type: "B" },
      { text: "気分転換になるよう、楽しい話題に切り替える", type: "C" },
      { text: "客観的に状況を整理し選択肢を示す", type: "D" }
    ]
  },
  {
    text: "グループディスカッションで、あなたが取りがちな役割は？",
    options: [
      { text: "議論をとめ、結論を導き出す", type: "A" },
      { text: "全員の意見を聞き、まとめ役になる", type: "B" },
      { text: "斬新なアイデアや、意外な視点を出す", type: "C" },
      { text: "データや事実に基づいて意見を述べる", type: "D" }
    ]
  },
  {
    text: "SNSやチャットで返信するとき、あなたのスタイルは？",
    options: [
      { text: "すぐに返信し、テンポよくやり取りする", type: "A" },
      { text: "相手の投稿に丁寧に反応する", type: "B" },
      { text: "スタンプや写真を多用して楽しむ", type: "C" },
      { text: "内容をよく考えてから、簡潔に返す", type: "D" }
    ]
  },
  {
    text: "人間関係で最も大切にしているのは？",
    options: [
      { text: "信頼関係と、お互いに成長できること", type: "A" },
      { text: "安心感と、支え合える関係", type: "B" },
      { text: "楽しさと、一、一緒にいて飽きなこと", type: "C" },
      { text: "誠実さと、深い理解し合えること", type: "D" }
    ]
  },
  {
    text: "意見の対立が起きたとき、あなたは？",
    options: [
      { text: "自分の意見をはっきり伝え、説得する", type: "A" },
      { text: "相手の気持ちを優先し、譲る", type: "B" },
      { text: "和稀泥して、雰囲気を和ませる", type: "C" },
      { text: "論点を整理し、建設的な議論を試みる", type: "D" }
    ]
  }
];

const results = {
  A: {
    type: "リーダータイプ",
    tagline: "「目標と信頼で、人を動かす」",
    desc: "あなたは意思疎通において明確さと方向性を重視します。相手に何を求めているかをはっきり伝え、同時に前向きなエネルギーを与えます。リダーシップがある一方、時に相手を置き去りにしてしまうことも。一度立ち止まって「相手のペース」を尊重すると、さらに深い信頼が生まれます。",
    traits: [
      { label: "主導性", value: "非常に高い" },
      { label: "対応スタイル", value: "目的指向" },
      { label: "強み", value: "決断力・推進力" },
      { label: "注意点", value: "相手のペース配慮" }
    ],
    comp: [
      { label: "相性◎", type: "協調タイプ" },
      { label: "相性○", type: "分析タイプ" }
    ],
    letter: "A"
  },
  B: {
    type: "協調タイプ",
    tagline: "「傾聴と包容で、場をつなぐ」",
    desc: "あなたは相手の気持ちを優先し、安心して話せる空間を作るのが得意です。対立を避け、みんなが納得できる道を探します。ただし、自分の意見を後回しにしすぎると、内に不満が溜まることも。時には「私はこう思う」と伝えることも、関係を深める潤滑油になります。",
    traits: [
      { label: "共感力", value: "非常に高い" },
      { label: "対応スタイル", value: "関係重視" },
      { label: "強み", value: "傾聴・調整力" },
      { label: "注意点", value: "自己主張のバランス" }
    ],
    comp: [
      { label: "相性◎", type: "リーダータイプ" },
      { label: "相性○", type: "表現タイプ" }
    ],
    letter: "B"
  },
  C: {
    type: "表現タイプ",
    tagline: "「自由とユーモアで、空気を変える」",
    desc: "あなたは人とのやり取りにおいて、楽しさと意外性を与える存在です。堅苦しい雰囲気を和ませ、場に新しい風を吹き込みます。時に軽く見られることもありますが、あなたの柔軟な発想は、人間関係の潤滑油となっています。ただし、本気の場面では真剣さを見せることも大切です。",
    traits: [
      { label: "表現力", value: "非常に高い" },
      { label: "対応スタイル", value: "感情・直感重視" },
      { label: "強み", value: "ユーモア・創造性" },
      { label: "注意点", value: "真剣さの切り替" }
    ],
    comp: [
      { label: "相性◎", type: "分析タイプ" },
      { label: "相性○", type: "協調タイプ" }
    ],
    letter: "C"
  },
  D: {
    type: "分析タイプ",
    tagline: "「論理と誠実さで、信頼を積む」",
    desc: "あなたはコミュニケーションにおいて、正確さと誠実さを重んじます。感情に流されず、事実と論理に基づいて対応します。一見クールに見えますが、相手のことを深く考えているからこその慎重さです。時に「考えすぎ」で機会を逃すこともあるので、時には直感で動いてみると新しい扉が開くかもしれません。",
    traits: [
      { label: "論理性", value: "非常に高い" },
      { label: "対応スタイル", value: "事実・論理重視" },
      { label: "強み", value: "洞察力・信頼性" },
      { label: "注意点", value: "過度慎重さ" }
    ],
    comp: [
      { label: "相性◎", type: "表現タイプ" },
      { label: "相性○", type: "リーダータイプ" }
    ],
    letter: "D"
  }
};

let current = 0;
let scores = { A:0, B:0, C:0, D:0 };
let currentResultKey = "A";

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function startTest() {
  current = 0;
  scores = { A:0, B:0, C:0, D:0 };
  showScreen('question-screen');
  renderQuestion();
}

function renderQuestion() {
  const q = questions[current];
  document.getElementById('q-number').textContent = 'Q' + (current+1);
  document.getElementById('q-counter').textContent = (current+1) + ' / ' + questions.length;
  document.getElementById('q-text').textContent = q.text;
  document.getElementById('progress-fill').style.width = ((current) / questions.length * 100) + '%';

  const optsDiv = document.getElementById('options');
  optsDiv.innerHTML = '';
  q.options.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = opt.text;
    btn.onclick = () => selectOption(opt.type);
    btn.style.animation = 'fadeIn 0.3s ease ' + (idx*0.06) + 's both';
    optsDiv.appendChild(btn);
  });
}

function selectOption(type) {
  scores[type]++;
  current++;
  if (current < questions.length) {
    renderQuestion();
  } else {
    document.getElementById('progress-fill').style.width = '100%';
    showScreen('loading-screen');
    setTimeout(showResult, 1800);
  }
}

function showResult() {
  let maxType = 'A';
  let maxScore = -1;
  for (const [t, s] of Object.entries(scores)) {
    if (s > maxScore) { maxScore = s; maxType = t; }
  }
  currentResultKey = maxType;
  const r = results[maxType];

  document.getElementById('r-type').textContent = r.type;
  document.getElementById('r-tagline').textContent = r.tagline;

  document.getElementById('c-badge').textContent = r.letter;
  document.getElementById('c-type').textContent = r.type;
  document.getElementById('c-tagline').textContent = r.tagline;
  document.getElementById('c-desc').textContent = r.desc;

  const cTraits = document.getElementById('c-traits');
  cTraits.innerHTML = '';
  r.traits.forEach(trait => {
    const card = document.createElement('div');
    card.className = 'ctrait-card';
    card.innerHTML = '<div class="ctrait-label">' + trait.label + '</div><div class="ctrait-value">' + trait.value + '</div>';
    cTraits.appendChild(card);
  });

  const cComp = document.getElementById('c-comp');
  cComp.innerHTML = '';
  r.comp.forEach(c => {
    const item = document.createElement('div');
    item.innerHTML = '<div class="ccomp-label">' + c.label + '</div><div class="ccomp-type">' + c.type + '</div>';
    cComp.appendChild(item);
  });

  showScreen('result-screen');
}

async function downloadResult() {
  const el = document.getElementById('result-capture');
  try {
    showToast('画像を生成中...');
    await document.fonts.ready;
    const canvas = await html2canvas(el, {
      scale: 3,
      useCORS: true,
      backgroundColor: '#F7F9F7',
      logging: false
    });
    const link = document.createElement('a');
    link.download = 'コミュニケーションスタイル診断結果.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
    showToast('画像をダウンロードしました');
  } catch (e) {
    showToast('画像の生成に失敗しました');
    console.error(e);
  }
}

function shareResult() {
  const r = results[currentResultKey];
  const text = '【コミュニケーションスタイル診断】\n私のタイプは「' + r.type + '」です。\n' + r.tagline + '\n' + r.desc.substring(0, 60) + '...';
  if (navigator.share) {
    navigator.share({
      title: 'コミュニケーションスタイル診断',
      text: text,
      url: location.href
    }).catch(() => {});
  } else {
    copyText();
  }
}

function copyText() {
  const r = results[currentResultKey];
  const text = '【コミュニケーションスタイル診断】\n' + r.type + '\n' + r.tagline + '\n\n' + r.desc + '\n\n相性の良いタイプ：' + r.comp.map(c => c.type).join('、');
  navigator.clipboard.writeText(text).then(() => showToast('テキストをコピーしました')).catch(() => showToast('コピーに失敗しました'));
}

function restartTest() {
  showScreen('intro-screen');
}
</script>
